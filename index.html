<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO Meta Tags -->
  <title>Versa Design Studio | Desain & Cetak Profesional Manado</title>
  <meta name="description" content="Versa Design Studio – layanan desain grafis, cetak banner, signage, packaging, dan merchandise profesional di Manado. Dari ide ke tangan pelanggan sejak 2018." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://digicipta.com/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://digicipta.com/" />
  <meta property="og:title" content="Versa Design Studio | Desain & Cetak Profesional Manado" />
  <meta property="og:description" content="Layanan desain grafis, cetak banner, signage, packaging, dan merchandise profesional di Manado sejak 2018." />
  <meta property="og:image" content="https://digicipta.com/LOGOVERSA.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/logo.png" />

  <!-- Preconnect: establish early connections before browser discovers resources -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://ohobzoyqkdckpidfoxcz.supabase.co" />
  <link rel="dns-prefetch" href="https://wa.me" />

  <!-- Google Fonts: non-blocking via <link> instead of CSS @import -->
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <!-- LCP Preload: hero image pertama agar browser fetch lebih awal -->
  <link
    rel="preload"
    as="image"
    href="/hero/hero2.webp"
    media="(min-width: 769px)"
  />
  <link
    rel="preload"
    as="image"
    href="/hero/hero2mobile.webp"
    media="(max-width: 768px)"
  />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
